<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>江湖探案录 · 卷一：客栈血影</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap');

:root {
  --bg-primary: #0a0c10;
  --bg-secondary: #12151c;
  --bg-card: #1a1e28;
  --bg-card-hover: #222836;
  --border-color: #2a3040;
  --border-active: #4a6fa5;
  --text-primary: #e8e6e3;
  --text-secondary: #9aa0b0;
  --text-muted: #606878;
  --accent-gold: #d4a853;
  --accent-red: #c0392b;
  --accent-blue: #2980b9;
  --accent-green: #27ae60;
  --clue-tag-bg: rgba(212,168,83,0.15);
  --clue-tag-text: #d4a853;
  --shadow-glow: 0 0 20px rgba(212,168,83,0.1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Serif SC', serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
  user-select: none;
}

/* ===== 顶部状态栏 ===== */
.top-bar {
  height: 44px;
  background: linear-gradient(180deg, #161a24 0%, #0f1219 100%);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 24px;
  font-size: 13px;
  position: relative;
  z-index: 100;
}

.top-bar .brand {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 20px;
  color: var(--accent-gold);
  letter-spacing: 2px;
  text-shadow: 0 0 10px rgba(212,168,83,0.3);
}

.top-bar .stat {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-secondary);
}

.top-bar .stat .label { color: var(--text-muted); }
.top-bar .stat .value { color: var(--text-primary); font-weight: 700; }

.top-bar .case-status {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 12px;
  border-radius: 4px;
  font-size: 12px;
}
.case-status.investigating { background: rgba(41,128,185,0.15); color: #5dade2; border: 1px solid rgba(41,128,185,0.3); }
.case-status.solved { background: rgba(39,174,96,0.15); color: #58d68d; border: 1px solid rgba(39,174,96,0.3); }

.top-bar .icon-btn {
  width: 32px; height: 32px;
  border: 1px solid var(--border-color);
  background: var(--bg-card);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--text-secondary);
  transition: all 0.2s;
  font-size: 14px;
}
.top-bar .icon-btn:hover { border-color: var(--border-active); color: var(--text-primary); }

/* ===== 主布局 ===== */
.main-layout {
  display: grid;
  grid-template-columns: 300px 1fr 320px;
  height: calc(100vh - 44px);
}

/* ===== 左侧线索面板 ===== */
.clue-panel {
  background: var(--bg-secondary);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.clue-panel-header {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.clue-panel-header h3 {
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}

.clue-count {
  background: var(--bg-card);
  color: var(--accent-gold);
  padding: 1px 8px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 400;
}

.clue-search {
  padding: 8px 14px;
  border-bottom: 1px solid var(--border-color);
  position: relative;
}

.clue-search input {
  width: 100%;
  padding: 7px 30px 7px 10px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 4px;
  color: var(--text-primary);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
}
.clue-search input:focus { border-color: var(--border-active); }
.clue-search input::placeholder { color: var(--text-muted); }
.clue-search .search-icon {
  position: absolute;
  right: 22px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 13px;
}

.clue-tags-hint {
  padding: 6px 14px;
  font-size: 11px;
  color: var(--accent-gold);
  border-bottom: 1px solid var(--border-color);
}

.clue-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.clue-list::-webkit-scrollbar { width: 4px; }
.clue-list::-webkit-scrollbar-track { background: transparent; }
.clue-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

.clue-item {
  padding: 10px 12px;
  margin-bottom: 4px;
  background: var(--bg-card);
  border: 1px solid transparent;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
  font-size: 13px;
  line-height: 1.5;
  position: relative;
}

.clue-item:hover { background: var(--bg-card-hover); border-color: var(--border-color); }
.clue-item.active { 
  border-color: var(--accent-gold); 
  background: rgba(212,168,83,0.08);
  box-shadow: var(--shadow-glow);
}
.clue-item.new { animation: clueNewPulse 2s ease-out; }
@keyframes clueNewPulse {
  0% { background: rgba(212,168,83,0.25); }
  100% { background: var(--bg-card); }
}

.clue-item .clue-name { font-weight: 600; color: var(--text-primary); }
.clue-item .clue-desc { color: var(--text-secondary); font-size: 12px; margin-top: 2px; }
.clue-item .clue-tag {
  display: inline-block;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 3px;
  background: var(--clue-tag-bg);
  color: var(--clue-tag-text);
  margin-top: 4px;
}

.clue-item .clue-tag.tag-person { background: rgba(192,57,43,0.15); color: #e74c3c; }
.clue-item .clue-tag.tag-evidence { background: rgba(41,128,185,0.15); color: #3498db; }
.clue-item .clue-tag.tag-location { background: rgba(39,174,96,0.15); color: #2ecc71; }
.clue-item .clue-tag.tag-doc { background: rgba(155,89,182,0.15); color: #9b59b6; }

/* ===== 中间主内容区 ===== */
.main-content {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.content-tabs {
  display: flex;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  padding: 0 16px;
}

.tab-btn {
  padding: 12px 18px;
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  position: relative;
  transition: color 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.tab-btn:hover { color: var(--text-primary); }
.tab-btn.active { color: var(--accent-gold); }
.tab-btn.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 16px;
  right: 16px;
  height: 2px;
  background: var(--accent-gold);
  box-shadow: 0 0 8px rgba(212,168,83,0.4);
}

.tab-content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
}

.tab-content::-webkit-scrollbar { width: 6px; }
.tab-content::-webkit-scrollbar-track { background: transparent; }
.tab-content::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

/* 场景描述卡片 */
.scene-card {
  background: linear-gradient(135deg, rgba(26,30,40,0.95) 0%, rgba(18,21,28,0.95) 100%);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 20px 24px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}
.scene-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent-gold), transparent);
}

.scene-card .scene-title {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 22px;
  color: var(--accent-gold);
  margin-bottom: 12px;
  letter-spacing: 1px;
}

.scene-card .scene-text {
  font-size: 14px;
  line-height: 1.9;
  color: var(--text-secondary);
}

.scene-card .scene-text .highlight {
  color: var(--accent-gold);
  font-weight: 600;
  cursor: pointer;
  border-bottom: 1px dashed var(--accent-gold);
}

.scene-card .scene-text .interactive {
  color: #5dade2;
  cursor: pointer;
  text-decoration: underline;
  text-decoration-style: dotted;
}

/* 录供问询 */
.interrogation-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  margin-bottom: 12px;
  overflow: hidden;
}

.interrogation-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  background: rgba(255,255,255,0.02);
  border-bottom: 1px solid var(--border-color);
}

.interrogation-avatar {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, #2c3e50, #1a252f);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 18px;
  color: var(--accent-gold);
  border: 2px solid var(--border-color);
  flex-shrink: 0;
}

.interrogation-name {
  font-weight: 700;
  font-size: 15px;
}

.interrogation-role {
  font-size: 12px;
  color: var(--text-muted);
}

.interrogation-body {
  padding: 14px 18px;
}

.dialog-bubble {
  background: rgba(41,128,185,0.08);
  border-left: 3px solid var(--accent-blue);
  padding: 12px 16px;
  border-radius: 0 6px 6px 0;
  font-size: 14px;
  line-height: 1.8;
  color: var(--text-secondary);
  margin-bottom: 10px;
}

.dialog-bubble.player {
  background: rgba(212,168,83,0.08);
  border-left: 3px solid var(--accent-gold);
  border-radius: 0 6px 6px 0;
}

/* 行动选项 */
.action-area {
  padding: 16px 24px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border-color);
}

.action-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 8px;
}

.action-btn {
  padding: 11px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 6px;
  color: var(--text-primary);
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  text-align: left;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 8px;
}
.action-btn:hover {
  border-color: var(--accent-gold);
  background: rgba(212,168,83,0.08);
  transform: translateY(-1px);
}
.action-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
}
.action-btn .action-icon {
  font-size: 16px;
  width: 22px;
  text-align: center;
  flex-shrink: 0;
}

/* ===== 右侧面板 ===== */
.right-panel {
  background: var(--bg-secondary);
  border-left: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.quest-card {
  flex-shrink: 0;
  background: linear-gradient(135deg, rgba(192,57,43,0.15) 0%, rgba(192,57,43,0.05) 100%);
  border: 1px solid rgba(192,57,43,0.3);
  border-radius: 8px;
  margin: 12px;
  padding: 14px 16px;
}

.quest-card .quest-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  font-size: 13px;
  font-weight: 700;
  color: #e74c3c;
}

.quest-card .quest-pid {
  font-size: 11px;
  color: var(--text-muted);
  margin-left: auto;
}

.quest-card .quest-text {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
}

.puzzle-section {
  flex-shrink: 0;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border-color);
}

.puzzle-section h4 {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.puzzle-box {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 16px;
}

.puzzle-input {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-radius: 4px;
  color: var(--text-primary);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  margin-bottom: 10px;
}
.puzzle-input:focus { border-color: var(--accent-blue); }

.puzzle-submit {
  width: 100%;
  padding: 10px;
  background: var(--accent-blue);
  border: none;
  border-radius: 4px;
  color: white;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  transition: opacity 0.2s;
}
.puzzle-submit:hover { opacity: 0.85; }

.puzzle-hint {
  margin-top: 10px;
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.6;
}

/* 地图/位置面板 */
.location-list {
  padding: 8px 12px;
}

.location-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 6px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: all 0.15s;
  font-size: 13px;
}
.location-item:hover { border-color: var(--accent-green); }
.location-item.current { border-color: var(--accent-green); background: rgba(39,174,96,0.08); }
.location-item .loc-icon { font-size: 16px; }
.location-item .loc-name { flex: 1; }
.location-item .loc-status { font-size: 11px; color: var(--text-muted); }

/* ===== 推理结论弹窗 ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal-content {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  max-width: 600px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  padding: 28px;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.modal-title {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 26px;
  color: var(--accent-gold);
  margin-bottom: 16px;
  text-align: center;
}

.modal-body {
  font-size: 14px;
  line-height: 1.9;
  color: var(--text-secondary);
  margin-bottom: 20px;
}

.modal-choices {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.modal-choice {
  padding: 14px 18px;
  background: var(--bg-card);
  border: 2px solid var(--border-color);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s;
  font-size: 14px;
  text-align: left;
  color: var(--text-primary);
  font-family: inherit;
}
.modal-choice:hover { border-color: var(--accent-gold); background: rgba(212,168,83,0.06); }

.modal-close {
  margin-top: 16px;
  width: 100%;
  padding: 12px;
  background: var(--border-color);
  border: none;
  border-radius: 6px;
  color: var(--text-primary);
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
}

/* ===== 通知/提示 ===== */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-card);
  border: 1px solid var(--accent-gold);
  color: var(--accent-gold);
  padding: 12px 24px;
  border-radius: 8px;
  font-size: 14px;
  z-index: 2000;
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

/* ===== 隐藏 ===== */
.hidden { display: none !important; }

/* ===== 打字机效果 ===== */
.typing-cursor::after {
  content: '|';
  animation: blink 1s infinite;
  color: var(--accent-gold);
}
@keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }

/* ===== 分隔线 ===== */
.divider {
  height: 1px;
  background: var(--border-color);
  margin: 12px 0;
}

/* ===== 新增工具栏 ===== */
.tools-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border-color);
  background: var(--bg-secondary);
}

.tool-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 7px 4px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 6px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
  font-size: 18px;
  font-family: inherit;
}
.tool-btn .tool-label { font-size: 10px; color: var(--text-muted); font-family: inherit; }
.tool-btn:hover { border-color: var(--border-active); color: var(--text-secondary); }
.tool-btn.active { border-color: var(--accent-gold); color: var(--accent-gold); background: rgba(212,168,83,0.08); }
.tool-btn.active .tool-label { color: var(--accent-gold); }


/* 工具面板 */
.tool-panels { flex: 1; overflow: hidden; min-height: 0; }
.tool-panel { display: none; flex-direction: column; height: 100%; overflow: hidden; }
.tool-panel.active { display: flex; }
.tool-panel-title { padding: 8px 12px; font-size: 12px; color: var(--text-muted); font-weight: 700; border-bottom: 1px solid var(--border-color); background: var(--bg-secondary); flex-shrink: 0; }

/* ===== 时间线面板 ===== */
.timeline-container {
  flex: 1;
  overflow-y: auto;
  padding: 10px 12px;
}
.timeline-container::-webkit-scrollbar { width: 4px; }
.timeline-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

.timeline-empty, .relation-empty, .log-empty, .board-empty {
  color: var(--text-muted);
  font-size: 12px;
  text-align: center;
  padding: 30px 10px;
  line-height: 1.8;
}

.timeline-item {
  position: relative;
  padding-left: 24px;
  padding-bottom: 16px;
  border-left: 2px solid var(--border-color);
  margin-left: 8px;
}
.timeline-item:last-child { border-left: none; padding-bottom: 0; }
.timeline-item::before {
  content: '';
  position: absolute;
  left: -9px;
  top: 2px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 2px solid var(--border-color);
  background: var(--bg-card);
}
.timeline-item.tl-active::before { border-color: var(--accent-gold); background: var(--accent-gold); }
.timeline-item.tl-done::before { border-color: var(--accent-green); background: var(--accent-green); }
.timeline-item.tl-clue::before { border-color: var(--accent-blue); background: var(--accent-blue); }

.tl-time { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; font-family: monospace; }
.tl-title { font-size: 13px; color: var(--text-primary); font-weight: 600; margin-bottom: 3px; }
.tl-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
.tl-tag { display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 3px; margin-top: 4px; }
.tl-tag.tag-location { background: rgba(39,174,96,0.15); color: #2ecc71; }
.tl-tag.tag-clue { background: rgba(41,128,185,0.15); color: #3498db; }
.tl-tag.tag-event { background: rgba(212,168,83,0.15); color: var(--accent-gold); }
.tl-tag.tag-interrogation { background: rgba(192,57,43,0.15); color: #e74c3c; }


/* ===== 人物关系图面板 ===== */
.relation-graph {
  flex: 1;
  overflow: hidden;
  position: relative;
}
.relation-graph svg { width: 100%; height: 100%; }
.rel-label { font-size: 11px; fill: var(--text-muted); font-family: inherit; text-anchor: middle; }
.rel-center-hint { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--text-muted); white-space: nowrap; }


/* ===== 案件日志面板 ===== */
.log-container {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px;
}
.log-container::-webkit-scrollbar { width: 4px; }
.log-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

.log-item { border-left: 2px solid var(--border-color); padding-left: 12px; margin-bottom: 12px; }
.log-item:last-child { border-left: 2px solid var(--accent-gold); }
.log-time { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; }
.log-title { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 3px; }
.log-text { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
.log-action { display: inline-block; font-size: 11px; color: var(--accent-gold); cursor: pointer; margin-top: 4px; }
.log-action:hover { text-decoration: underline; }


/* ===== 证据链面板 ===== */
.board-container { flex: 1; overflow-y: auto; padding: 10px 12px; }
.board-container::-webkit-scrollbar { width: 4px; }
.board-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

.board-section-title { font-size: 11px; color: var(--text-muted); font-weight: 700; margin-bottom: 8px; margin-top: 12px; text-transform: uppercase; letter-spacing: 1px; }
.board-section-title:first-child { margin-top: 0; }

.board-progress { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 12px; }
.board-progress-bar { flex: 1; height: 6px; background: var(--bg-card); border-radius: 3px; overflow: hidden; }
.board-progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent-blue), var(--accent-gold)); border-radius: 3px; transition: width 0.5s ease; width: 0%; }
.board-progress-text { color: var(--accent-gold); white-space: nowrap; }

.board-theorem { background: rgba(212,168,83,0.06); border: 1px solid rgba(212,168,83,0.2); border-radius: 6px; padding: 12px; margin-bottom: 12px; }
.board-theorem-title { font-size: 12px; font-weight: 700; color: var(--accent-gold); margin-bottom: 6px; }
.board-theorem-text { font-size: 12px; color: var(--text-secondary); line-height: 1.7; }

.board-slots { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
.board-slot { padding: 8px 12px; background: var(--bg-card); border: 1px dashed var(--border-color); border-radius: 4px; font-size: 12px; color: var(--text-muted); min-height: 36px; display: flex; align-items: center; }
.board-slot.filled { border-style: solid; border-color: var(--border-active); color: var(--text-primary); background: rgba(41,128,185,0.06); }
.board-slot.locked { opacity: 0.4; }
.board-slot-icon { margin-right: 8px; }
.board-slot-check { color: var(--accent-green); margin-left: auto; }

/* 谜题区域样式 */
.puzzle-section { padding: 10px 12px; border-bottom: 1px solid var(--border-color); }

/* ==================== 移动端竖屏适配 ==================== */
@media (max-width: 768px) {
  body { font-size: 14px; }

  /* 顶部栏精简 */
  .top-bar {
    height: 40px;
    padding: 0 10px;
    gap: 10px;
    overflow-x: auto;
    flex-wrap: nowrap;
  }
  .top-bar .brand { font-size: 16px; letter-spacing: 1px; flex-shrink: 0; }
  .top-bar .stat { display: none; }
  /* 只保留功勋和状态 */
  .top-bar .stat:nth-of-type(1) { display: flex; font-size: 12px; }
  .top-bar .stat:nth-of-type(1) .label { display: none; }
  .top-bar .case-status { font-size: 11px; padding: 2px 8px; flex-shrink: 0; }
  .top-bar .icon-btn { width: 28px; height: 28px; font-size: 13px; flex-shrink: 0; }

  /* 三栏 → 单栏 + 底部Tab */
  .main-layout {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr auto;
    height: calc(100vh - 40px);
  }

  /* 左侧线索面板 → 作为底部Tab的一个页面 */
  .clue-panel {
    position: fixed;
    inset: 40px 0 56px 0;
    z-index: 50;
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    border-right: none;
  }
  .clue-panel.mobile-show {
    transform: translateX(0);
  }

  /* 右侧面板 → 同理 */
  .right-panel {
    position: fixed;
    inset: 40px 0 56px 0;
    z-index: 50;
    transform: translateX(100%);
    transition: transform 0.3s ease;
    border-left: none;
    overflow-y: auto;
  }
  .right-panel.mobile-show {
    transform: translateX(0);
  }

  /* 中间内容区占满 */
  .main-content {
    min-height: 0;
  }

  /* 内容标签页文字缩小 */
  .content-tabs {
    padding: 0 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .tab-btn {
    padding: 10px 12px;
    font-size: 12px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .tab-btn.active::after { left: 8px; right: 8px; }

  .tab-content {
    padding: 14px 14px;
  }

  /* 场景卡片 */
  .scene-card { padding: 16px; }
  .scene-card .scene-title { font-size: 18px; }
  .scene-card .scene-text { font-size: 13px; line-height: 1.8; }

  /* 行动按钮区 */
  .action-area {
    padding: 10px 12px;
  }
  .action-grid {
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 6px;
  }
  .action-btn {
    padding: 12px 12px;
    font-size: 13px;
  }

  /* 底部导航Tab（移动端独有） */
  .mobile-nav {
    display: flex !important;
  }

  /* 对话卡片 */
  .interrogation-header { padding: 10px 14px; }
  .interrogation-avatar { width: 36px; height: 36px; font-size: 15px; }
  .interrogation-body { padding: 10px 14px; }
  .dialog-bubble { padding: 10px 14px; font-size: 13px; }

  /* 任务卡 */
  .quest-card { margin: 8px; padding: 10px 12px; }

  /* 谜题区 */
  .puzzle-section { padding: 8px; }
  .puzzle-box { padding: 12px; }

  /* 地点列表 */
  .location-item { padding: 8px 10px; font-size: 13px; }

  /* 线索项 */
  .clue-item { padding: 9px 10px; font-size: 13px; }

  /* 弹窗 */
  .modal-content {
    width: 95%;
    padding: 20px;
    max-height: 85vh;
  }
  .modal-title { font-size: 22px; }

  /* Toast */
  .toast {
    bottom: 70px;
    font-size: 13px;
    padding: 10px 18px;
    left: 10px;
    right: 10px;
    transform: none;
    text-align: center;
  }
}

/* 底部导航（默认隐藏，移动端显示） */
.mobile-nav {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 56px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border-color);
  z-index: 100;
  grid-template-columns: repeat(4, 1fr);
  align-items: center;
  justify-content: space-around;
  padding-bottom: env(safe-area-inset-bottom, 0);
}

.mobile-nav-item {

  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: var(--text-muted);
  font-size: 10px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;

  height: 100%;

.mobile-nav-item.active,
.mobile-nav-item:active {

}

.mobile-nav-item .nav-icon {

  line-height: 1;
}

/* 移动端遮罩 */
.mobile-overlay {
  display: none;
  position: fixed;
  inset: 40px 0 56px 0;
  background: rgba(0,0,0,0.5);
  z-index: 45;
}
.mobile-overlay.show { display: block; }
</style>
</head>
<body>

<!-- 顶部状态栏 -->
<div class="top-bar">

<!-- 主布局 -->
<div class="main-layout">

<!-- 左侧：线索面板 -->
<div class="clue-panel">

    <span class="search-icon">🔎</span>

  <div class="clue-tags-hint" id="tagsHint">核心线索已找齐 ✅</div>
  <div class="clue-list" id="clueList">
    <!-- 动态生成 -->
  </div>
</div>

<!-- 中间：主内容区 -->
<div class="main-content">
  <!-- 标签页 -->
  <div class="content-tabs">
    <button class="tab-btn active" data-tab="scene" onclick="switchTab('scene')">📍 现场</button>
    <button class="tab-btn" data-tab="investigation" onclick="switchTab('investigation')">🔎 验尸勘验</button>
    <button class="tab-btn" data-tab="interrogation" onclick="switchTab('interrogation')">📝 录供问询</button>

  <!-- 场景内容 -->

  <!-- 行动选项区 -->

</div>

  <!-- 新增工具栏 -->

    </button>

      <span>🔗</span><span class="tool-label">关系</span>

      <span>📖</span><span class="tool-label">日志</span>
    </button>
    <button class="tool-btn" id="toolBtnBoard" onclick="switchToolPanel('board')" title="证据链">
      <span>🧩</span><span class="tool-label">证据链</span>
    </button>
  </div>

  <!-- 工具面板容器 -->
  <div class="tool-panels" id="toolPanels">

    <!-- 时间线面板 -->
    <div class="tool-panel active" id="panelTimeline">
      <div class="tool-panel-title">📊 案发时间线</div>

  </div>


  <div class="divider"></div>
  
  <div style="padding:12px;">

      <!-- 动态生成 -->

  </div>
</div>

</div>

<script>
// ==================== 游戏数据 ====================

const GAME = {

      { id: 'c2', name: '反锁的房门', desc: '203号房的门从内部用门栓拴住，窗户紧闭且完好无损。但现场没有发现任何暗道或机关。', tag: 'evidence', tagLabel: '证物' },
      { id: 'c3', name: '死者随身物品', desc: '腰间无兵器，仅有一块刻有"云"字的玉佩、一封未拆封的信函、若干散碎银两。信函上写着"交云兄亲启"。', tag: 'evidence', tagLabel: '证物' },
      { id: 'c4', name: '王老板证词', desc: '"这位客官是三天前入住的，登记名字叫李云。说是来这边做药材生意的，每天早出晚归，话不多。"', tag: 'person', tagLabel: '人物' },
      { id: 'c5', name: '店小二证词', desc: '"子时左右我听见楼上好像有动静，但以为是客人翻身就没在意。后来……后来天亮才发现出事了！"', tag: 'person', tagLabel: '人物' },
      { id: 'c6', name: '刘婶证词', desc: '"那天晚上我在厨房熬粥，大概亥时末（21点多）看见一个人影从后院翻墙出去了。穿着深色衣服，身形挺瘦的。"', tag: 'person', tagLabel: '人物' },
      { id: 'c7', name: '张商人证词', desc: '"我和那位李客官在院子里聊过天。他说他是从京城来的，对这一带不太熟。看起来不像做药材买卖的，倒像是……练家子。"', tag: 'person', tagLabel: '人物' },
      { id: 'c8', name: '青衣剑客证词', desc: '"（冷笑）那人的步法是军中训练出来的，不是什么药材商。而且他腰间的玉佩——那是北境军中的信物。"', tag: 'person', tagLabel: '人物' },
      { id: 'c9', name: '密信内容', desc: '拆开死者身上的信函，上面写道："事已备妥，三日后子时悦来客栈交接。切记勿带随从。——K"。落款只有一个字母"K"。', tag: 'doc', tagLabel: '文书' },
      { id: 'c10', name: '墙外脚印', desc: '客栈后墙外的泥地上发现几枚脚印，鞋底纹路特殊——是官靴。方向朝向镇外。', tag: 'evidence', tagLabel: '证物' },
      { id: 'c11', name: '县衙卷宗', desc: '近三个月内，周边地区已发生三起类似命案：死者均为中年男性，胸口细长刀伤，身份不明或使用假名。均被定性为"江湖仇杀"。', tag: 'doc', tagLabel: '文书' },
      { id: 'c12', name: '玉佩的秘密', desc: '这块玉佩上的"云"字刻法特殊，是北境边军的暗记。北境军近年因粮饷问题屡有异动……', tag: 'evidence', tagLabel: '证物' }
    ],
    scenes: {
      inn_opening: {
        title: '序章：风雨欲来',
        text: `<p>大梁国<span class="highlight">景隆四年</span>，秋。</p>
        <p>你策马疾驰了三日，终于在这座名为"清风镇"的小城停下脚步。</p>
        <p>三日前，一封加急密报送至提刑司——<span class="highlight">悦来客栈发生命案</span>，死者身份蹊跷，地方县令请求派专人彻查。</p>
        <p>作为提刑司最年轻的提刑官，你接下了这个案子。</p>
        <p>此刻，你站在悦来客栈门前。招牌上的"悦来"二字在秋风中微微摇晃，客栈里透出昏黄的烛光。</p>
        <p>空气中弥漫着一股淡淡的<span class="interactive" onclick="addClue('c1')">血腥气</span>……</p>`,
        actions: [
          { text: '进入客栈大厅', icon: '🚪', action: 'go_inn_hall' },
          { text: '先观察周围环境', icon: '👁️', action: 'look_around' }
        ]
      },
      look_around: {
        title: '观察周围',
        text: `<p>你在客栈外仔细观察了一番。</p>

// ==================== 游戏状态管理 ====================

let currentScene = 'inn_opening';
let currentTab = 'scene';

function initGame() {
  renderClues();
  renderScene(currentScene);
  renderActions(CASES[1].scenes[currentScene].actions);
  renderLocations();
  updateStats();
  
  // 初始解锁部分线索
  setTimeout(() => {
    addClue('c1');
  }, 1500);
}

// ==================== 线索系统 ====================

function addClue(clueId) {
  if (GAME.clues.includes(clueId)) return;
  
  const clueData = CASES[1].clues.find(c => c.id === clueId);
  if (!clueData) return;
  
  GAME.clues.push(clueId);
  GAME.score += 5;
  updateStats();
  renderClues();
  
  showToast(`🔍 新线索：${clueData.name}`);
  
  // 检查是否可以进入推理阶段
  if (GAME.clues.length >= 6 && !GAME.flags.deductionUnlocked) {
    GAME.flags.deductionUnlocked = true;
    setTimeout(() => {
      showToast('🧠 已收集足够线索，可以进行推理了！');
    }, 1000);
  }
}

function renderClues() {
  const list = document.getElementById('clueList');
  const search = document.getElementById('clueSearchInput').value.toLowerCase();
  
  const filteredClues = CASES[1].clues.filter(c => {
    if (!GAME.clues.includes(c.id)) return false;
    if (search && !c.name.toLowerCase().includes(search) && !c.desc.toLowerCase().includes(search)) return false;
    return true;
  });
  
  list.innerHTML = filteredClues.map(c => `
    <div class="clue-item new" onclick="showClueDetail('${c.id}')">
      <div class="clue-name">${c.name}</div>
      <div class="clue-desc">${c.desc.substring(0, 40)}...</div>
      <span class="clue-tag tag-${c.tag}">${c.tagLabel}</span>
    </div>
  `).join('');
  
  document.getElementById('clueCount').textContent = GAME.clues.length;
  
  // 更新标签提示
  const hint = document.getElementById('tagsHint');
  if (GAME.clues.length >= 8) {
    hint.textContent = '核心线索已找齐 ✅';
    hint.style.color = 'var(--accent-green)';
  } else if (GAME.clues.length >= 4) {
    hint.textContent = `还需 ${8 - GAME.clues.length} 条核心线索`;
    hint.style.color = 'var(--accent-gold)';
  } else {
    hint.textContent = `还需 ${8 - GAME.clues.length} 条核心线索`;
    hint.style.color = 'var(--accent-gold)';
  }
}

function filterClues() { renderClues(); }

function showClueDetail(clueId) {
  const clue = CASES[1].clues.find(c => c.id === clueId);
  if (!clue) return;
  
  // 高亮选中
  document.querySelectorAll('.clue-item').forEach(el => el.classList.remove('active'));
  if (event && event.currentTarget) event.currentTarget.classList.add('active');
  
  // 在右侧显示详情
  document.getElementById('puzzleTitle').textContent = `📋 ${clue.name}`;
  document.getElementById('puzzleBox').innerHTML = `
    <div style="font-size:13px;line-height:1.8;color:var(--text-secondary);">${clue.desc}</div>
    <div style="margin-top:12px;">
      <span class="clue-tag tag-${clue.tag}">${clue.tagLabel}</span>
    </div>
  `;
  
  // 移动端：自动切换到右侧面板查看详情
  if (isMobile()) {
    switchMobilePanel('side');
  }
}

// ==================== 场景渲染 ====================

function renderScene(sceneKey) {
  const scene = CASES[1].scenes[sceneKey];
  if (!scene) return;
  
  currentScene = sceneKey;
  const container = document.getElementById('tabScene');
  container.innerHTML = `
    <div class="scene-card">
      <div class="scene-title">${scene.title}</div>
      <div class="scene-text typing-cursor">${scene.text}</div>
    </div>
  `;
  
  // 移除打字光标效果
  setTimeout(() => {
    const el = container.querySelector('.typing-cursor');
    if (el) el.classList.remove('typing-cursor');
  }, 3000);
}

function renderActions(actions) {
  const grid = document.getElementById('actionGrid');
  grid.innerHTML = actions.map(a => `
    <button class="action-btn" onclick="doAction('${a.action}')">
      <span class="action-icon">${a.icon}</span>
      <span>${a.text}</span>
    </button>
  `).join('');
}

// ==================== 行动处理 ====================

function doAction(action) {
  switch(action) {
    case 'go_inn_hall':
      renderScene('go_inn_hall');
      renderActions(CASES[1].scenes.go_inn_hall.actions);
      goLocation('inn');
      break;
      
    case 'look_around':
      renderScene('look_around');
      renderActions(CASES[1].scenes.look_around.actions);
      break;
      
    case 'go_corpse_room':
      renderScene('corpse_room');
      renderActions(CASES[1].scenes.corpse_room.actions);
      goLocation('corpse_room');
      addClue('c1');
      break;
      
    case 'search_room':
      renderScene('search_room');
      renderActions(CASES[1].scenes.search_room.actions);
      break;
      
    case 'examine_jade':
      addClue('c12');
      showToast('💎 你仔细端详这块玉佩——上面的"云"字刻法很不寻常...');
      renderScene('search_room');
      renderActions(CASES[1].scenes.search_room.actions);
      break;
      
    case 'read_letter':
      addClue('c9');
      showToast('✉️ 信的内容让你心头一震……');
      renderScene('search_room');
      renderActions(CASES[1].scenes.search_room.actions);
      break;
      
    case 'search_room_done':
      renderScene('corpse_room');
      renderActions(CASES[1].scenes.corpse_room.actions);
      break;
      
    case 'go_kitchen':
      renderScene('kitchen');
      renderActions(CASES[1].scenes.kitchen.actions);
      goLocation('kitchen');
      break;
      
    case 'go_courtyard':
      renderScene('courtyard');
      renderActions(CASES[1].scenes.courtyard.actions);
      goLocation('courtyard');
      break;
      
    case 'go_yamen':
      renderScene('yamen');
      renderActions(CASES[1].scenes.yamen.actions);
      goLocation('yamen');
      unlockLocation('street');
      break;
      
    case 'go_backyard':
      addClue('c10');
      showToast('👣 你在后墙外发现了可疑的脚印！');
      renderScene('kitchen');
      renderActions(CASES[1].scenes.kitchen.actions);
      break;
      
    case 'check_back_wall':
      addClue('c10');
      showToast('👣 泥地上有几枚清晰的脚印，纹路很特别……');
      renderScene('look_around');
      renderActions(CASES[1].scenes.look_around.actions);
      break;
      
    case 'check_dirt':
      showToast('🕳️ 泥土中被埋着一块布片——深色的，似乎是衣服上撕下来的。');
      addClue('c2');
      renderScene('courtyard');
      renderActions(CASES[1].scenes.courtyard.actions);
      break;
      
    case 'check_corridor':
      showToast('👀 二楼栏杆外侧有细微的抓痕……有人从这里攀爬过？');
      addClue('c2');
      renderScene('courtyard');
      renderActions(CASES[1].scenes.courtyard.actions);
      break;
      
    case 're_examine':
      addClue('c3');
      showToast('🔬 作作的补充验尸报告：死者胸口的伤口极细，宽度不超过两指，深度却足以致命。这种伤口……需要特殊的兵器。');
      renderScene('yamen');
      renderActions(CASES[1].scenes.yamen.actions);
      break;
      
    case 'start_deduction':
      if (GAME.clues.length < 6) {
        showToast('⚠️ 线索不足！至少需要收集6条线索才能进行推理。');
        return;
      }
      renderScene('deduction_ready');
      renderActions(CASES[1].scenes.deduction_ready.actions);
      // 设置谜题
      GAME.puzzleActive = 'final_deduction';
      document.getElementById('puzzleTitle').textContent = '🧠 最终推理';
      document.getElementById('puzzleDesc').textContent = CASES[1].puzzles.final_deduction.desc;
      document.getElementById('puzzleInput').placeholder = '输入凶手名字...';
      document.getElementById('puzzleHint').innerHTML = '';
      break;
      
    case 'talk_wang':
      talkTo('wang_po');
      break;
    case 'talk_liu':
      talkTo('liu_auntie');
      break;
      
    default:
      console.log('Unknown action:', action);
  }
}

function goLocation(locKey) {
  GAME.currentLocation = locKey;
  renderLocations();
}

function unlockLocation(locKey) {
  if (!GAME.unlockedLocations.includes(locKey)) {
    GAME.unlockedLocations.push(locKey);
    renderLocations();
    showToast(`📍 解锁新地点：${CASES[1].locations[locKey]?.name || locKey}`);
  }
}

function renderLocations() {
  const list = document.getElementById('locationList');
  list.innerHTML = Object.entries(CASES[1].locations).map(([key, loc]) => {
    const unlocked = GAME.unlockedLocations.includes(key);
    const isCurrent = GAME.currentLocation === key;
    return `
      <div class="location-item ${isCurrent ? 'current' : ''}" 
           onclick="${unlocked ? `goLocation('${key}')` : ''}"
           style="${!unlocked ? 'opacity:0.4;cursor:not-allowed;' : ''}">
        <span class="loc-icon">${unlocked ? loc.icon : '🔒'}</span>
        <span class="loc-name">${unlocked ? loc.name : '???'}</span>

}

// ==================== 谜题系统 ====================

function submitPuzzle() {
  if (!GAME.puzzleActive) return;
  
  const puzzle = CASES[1].puzzles[GAME.puzzleActive];
  const input = document.getElementById('puzzleInput').value.trim();
  const hintEl = document.getElementById('puzzleHint');
  
  if (!input) {
    hintEl.textContent = '请输入答案';
    return;
  }
  
  if (input === puzzle.answer || input.includes(puzzle.answer) || puzzle.answer.includes(input)) {
    // 正确
    hintEl.innerHTML = '<span style="color:var(--accent-green);">✅ 回答正确！</span>';
    GAME.score += 20;
    updateStats();
    
    setTimeout(() => {
      if (puzzle.onSuccess === 'showCase1Ending') {
        showCase1Ending();
      }
    }, 1000);
  } else {
    // 错误
    GAME.flags.wrongAttempts = (GAME.flags.wrongAttempts || 0) + 1;
    const hintIdx = Math.min(GAME.flags.wrongAttempts - 1, (puzzle.hints?.length || 0) - 1);
    
    if (puzzle.hints && hintIdx >= 0) {
      hintEl.innerHTML = `<span style="color:var(--accent-red);">❌ 不对。提示：${puzzle.hints[hintIdx]}</span>`;
    } else {
      hintEl.innerHTML = '<span style="color:var(--accent-red);">❌ 不对，再想想...</span>';
    }
  }
}

// ==================== UI工具函数 ====================

function updateStats() {
  document.getElementById('score').textContent = GAME.score;
}

function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  
  setTimeout(() => toast.remove(), 3000);
}

function showModal(title, body, closable = true) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modalOverlay';
  overlay.innerHTML = `
    <div class="modal-content">
      <div class="modal-title">${title}</div>
      <div class="modal-body">${body}</div>
      ${closable ? '<button class="modal-close" onclick="closeModal()">关闭</button>' : ''}
    </div>
  `;
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
  document.body.appendChild(overlay);
}

function closeModal() {
  const modal = document.getElementById('modalOverlay');
  if (modal) modal.remove();
}

function saveGame() {
  const saveData = JSON.stringify(GAME);
  localStorage.setItem('jianghu_detective_save', saveData);
  showToast('💾 存档成功');
}

function loadGame() {
  const data = localStorage.getItem('jianghu_detective_save');
  if (data) {
    Object.assign(GAME, JSON.parse(data));
    return true;
  }
  return false;
}

  var d=CASES[1].clues.find(function(c){return c.id===cid;});
  if(!d)return;
  GAME.clues.push(cid);
  renderClues();
  showToast('🔍 新线索：'+d.name);
  renderTimeline();renderRelationGraph();renderBoard();
  if(GAME.clues.length>=6&&!GAME.flags.deductionUnlocked){
    GAME.flags.deductionUnlocked=true;
    showToast('🧠 解锁推理系统！可以开始指认凶手了');
    var pd=document.getElementById('puzzleDesc');
    if(pd)pd.textContent='线索已足够，输入凶手身份提交结案';
  }
  if(GAME.clues.length>=8)renderLocationList();
  saveGame();
};
var _oldGoScene=goScene;
goScene=function(key){
  var sc=CASES[1].scenes[key];
  if(sc){var plain=sc.text.replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();addLogEntry(sc.title,plain.substr(0,60)+'…','event');renderTimeline();}
  _oldGoScene(key);
  renderRelationGraph();
};
var _oldTalkTo=talkTo;
talkTo=function(cid){
  var ch=CASES[1].characters[cid];
  if(ch)addLogEntry('与'+ch.name+'交谈','正在询问与案件相关的问题…','interrogation');
  _oldTalkTo(cid);
  renderRelationGraph();
};
var _oldInitGame=initGame;
initGame=function(){
  _oldInitGame();
  addLogEntry('提刑官抵达清风镇','奉命彻查悦来客栈命案，任重道远。','event');
  switchToolPanel('timeline');
  renderTimeline();renderRelationGraph();renderBoard();
};
</script>
</body>
